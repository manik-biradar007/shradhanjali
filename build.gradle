

buildscript {

    repositories {
        google()
        jcenter()

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.2'




    }
}

allprojects {
    repositories {
        google()
        jcenter()
        maven { url "https://jitpack.io" }
        mavenCentral()

        maven { url 'https://maven.google.com' }
        flatDir {
            dirs("libs")
        }

    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
