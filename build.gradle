

buildscript {

    repositories {
        google()
        mavenCentral()

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.1'




    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }

        maven { url 'https://maven.google.com' }
        flatDir {
            dirs("libs")
        }

    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
